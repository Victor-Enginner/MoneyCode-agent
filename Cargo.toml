# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = [
    "crates/risk",
    "crates/store",
    "crates/capture",
    "crates/core",
    "crates/strategy-native",
    "crates/strategy-runtime",
    "crates/telemetry",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", path = "vendor/sqlx", features = ["sqlite", "runtime-tokio", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
