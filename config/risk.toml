# Configuração de risco aprovada pelo Monte Carlo do §13 (10.000 sessões de 1 h) para banca de ~R$ 80.
# Escada de 3 degraus: 20, 60, 180 centavos. Exposição máxima no degrau 3 = 360 centavos (R$ 3,60);
# perda acumulada máxima = 520 centavos (R$ 5,20).
# Medição: base 20¢ · 3 degraus -> P(ruína)=0,00% · DD p95=520¢. Com 4 degraus sobe a 8,16% e reprova o gate.
base_cents = 20
max_steps = 3
max_bet_per_cover_cents = 100000
max_exposure_pct = 0.10
stop_loss_cents = 1600
stop_win_pct = 0.08
min_window_ms = 2000
cooldown_spins = 2
max_entries_per_hour = 40
chip_denoms_cents = [2500, 1000, 500, 100, 50, 10]
